# Read by catalog-migrate (deploy/compose.yml). No real credentials here —
# ${VAR} placeholders resolve from catalog-migrate's own environment (set in
# compose.yml from the same .env every other service in this repo reads).
changelogFile=changelog/changelog-master.yaml
url=jdbc:postgresql://catalog-db:5432/catalog_db
username=${POSTGRES_USER}
password=${POSTGRES_PASSWORD}
