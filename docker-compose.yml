# Standalone compose for this repo's own database lifecycle (migrations, seeds,
# backups) — lms-infra composes this alongside the other per-context repos later
# (ADR-006-repo-per-context-decomposition.md), reusing these same service blocks.
services:
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      POSTGRES_DB: catalog_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - lms-network

  catalog-migrate:
    image: migrate/migrate:v4.17.1
    container_name: catalog-migrate
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@catalog-db:5432/catalog_db?sslmode=disable"
      - "up"
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - lms-network

volumes:
  catalog-db-data:

networks:
  lms-network:
    driver: bridge
